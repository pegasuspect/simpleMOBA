<html>

<head>
    <style>
        canvas {
            margin: auto;
            width: 800px;
            height: 600px;
            border: 1px solid #000000;
        }

        div.lola {
            margin: auto;
            margin-top: 50px;
            display: flex;
            align-items: center;
        }

        #loading {
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            var c = document.getElementById("myCanvas");
            var ctx = c.getContext("2d");
            var socket = io();
            var loadingDiv = document.getElementById("loading");

            // Map to load — can be changed via URL param: ?map=summoners-rift
            var params = new URLSearchParams(window.location.search);
            var mapName = params.get("map") || "summoners-rift";

            // Create game instance (id assigned when server responds)
            window.game = new Game(ctx, socket, -1);

            socket.on('id', (id) => {
                if (window.game && window.game.id === -1) window.game.id = id;
            });

            // Load the map from the server, then start the game loop
            fetch(`/maps/${mapName}.json`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    var map = GameMap.fromJSON(data);
                    window.game.loadMap(map);
                    loadingDiv.style.display = 'none';
                })
                .catch(err => {
                    loadingDiv.textContent = `Failed to load map "${mapName}": ${err.message}`;
                    loadingDiv.style.color = 'red';
                    console.error('Map load error:', err);
                });

            // Send local player position to server
            setInterval(() => {
                if (window.game && window.game.id !== -1) {
                    socket.emit('position', {
                        x: window.game.p1.x,
                        y: window.game.p1.y,
                        id: window.game.id
                    });
                }
            }, 70)

            // Receive other players' positions
            socket.on('position', function (otherPlayers) {
                window.game.otherPlayers = otherPlayers;
            });

            // Input handlers
            c.addEventListener("mousedown", window.game.controller.mouseDown.bind(window.game.controller))
            c.addEventListener("contextmenu", window.game.controller.contextMenu.bind(window.game.controller))
            document.addEventListener("keydown", window.game.controller.keyDown.bind(window.game.controller))
            document.addEventListener("keyup", window.game.controller.keyUp.bind(window.game.controller))

            // Start the fixed-timestep game loop
            window.game.start();

        });
    </script>

    <!-- Load modules in dependency order -->
    <script src="Map.js"></script>
    <script src="src/Constants.js"></script>
    <script src="src/Geometry.js"></script>
    <script src="src/Camera.js"></script>
    <script src="src/Player.js"></script>
    <script src="src/Renderer.js"></script>
    <script src="src/Controller.js"></script>
    <script src="src/Game.js"></script>

    <div class="lola">
        <canvas id="myCanvas" width="800" height="600"></canvas>
    </div>
    <div id="loading">Loading map...</div>
</body>

</html>
