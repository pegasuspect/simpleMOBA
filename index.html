<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Mobile viewport: fill screen, prevent user scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SimpleMOBA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            /* Prevent text selection on long-press */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            /* Prevent gesture-based zoom */
            touch-action: none;
            overscroll-behavior: none;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #myCanvas {
            display: block;
            /* Canvas fills the viewport via JS resize */
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            color: #555;
        }

        /* Mobile hint — shown on touch devices */
        #mobileHint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: sans-serif;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Link to editor (top-right, semi-transparent) */
        #editorLink {
            position: absolute;
            top: 8px;
            right: 12px;
            font-family: sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            pointer-events: auto;
        }
        #editorLink:active { color: rgba(255, 255, 255, 0.6); }

        /* --- Username modal --- */
        #nameModal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #nameModal.hidden { display: none; }
        #nameModal .dialog {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 24px 28px;
            text-align: center;
            font-family: sans-serif;
            min-width: 300px;
        }
        #nameModal h2 {
            color: #e0e0e0;
            font-size: 18px;
            margin-bottom: 12px;
        }
        #nameModal p {
            color: #888;
            font-size: 12px;
            margin-bottom: 16px;
        }
        #nameModal input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #0a0a0a;
            color: #e0e0e0;
            font-size: 15px;
            font-family: monospace;
            outline: none;
            box-sizing: border-box;
        }
        #nameModal input:focus { border-color: #5599ff; }
        #nameModal button {
            margin-top: 14px;
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            background: #4488dd;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        #nameModal button:active { background: #3377cc; }
        #nameModal .error {
            color: #ff6666;
            font-size: 12px;
            margin-top: 10px;
            min-height: 14px;
        }

        /* --- Chat panel (bottom-left) --- */
        #chatPanel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 320px;
            max-height: 240px;
            display: flex;
            flex-direction: column;
            z-index: 50;
            pointer-events: auto;
        }
        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #ccc;
            background: rgba(0, 0, 0, 0.5);
            max-height: 200px;
            scrollbar-width: thin;
        }
        #chatMessages .chat-user { color: #6fa8dc; }
        #chatMessages .chat-self { color: #93c47d; }
        #chatMessages .chat-system { color: #999; font-style: italic; }
        #chatInput {
            width: 100%;
            padding: 8px 10px;
            border: none;
            border-top: 1px solid #333;
            background: rgba(0, 0, 0, 0.7);
            color: #e0e0e0;
            font-size: 12px;
            font-family: monospace;
            outline: none;
            box-sizing: border-box;
        }
        #chatInput::placeholder { color: #555; }

        /* --- Online users panel (top-left) --- */
        #usersPanel {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: sans-serif;
            font-size: 12px;
            color: #aaa;
            z-index: 50;
            min-width: 120px;
            max-width: 200px;
        }
        #usersPanel .users-title {
            color: #e0e0e0;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #usersPanel .users-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        #usersPanel .users-list li {
            padding: 1px 0;
            color: #88aacc;
        }
        #usersPanel .users-list li.me {
            color: #93c47d;
            font-weight: bold;
        }
        #usersPanel .users-count {
            color: #666;
            font-size: 10px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="myCanvas"></canvas>
        <div id="loading">Loading map...</div>
        <div id="mobileHint" style="display:none;">Tap: move · Drag: pan camera</div>
        <a id="editorLink" href="/editor">🗺️ Editor</a>

        <!-- Online users panel -->
        <div id="usersPanel">
            <div class="users-title">Online</div>
            <ul class="users-list" id="usersList"></ul>
            <div class="users-count" id="usersCount">0 players</div>
        </div>

        <!-- Chat panel -->
        <div id="chatPanel">
            <div id="chatMessages"></div>
            <input id="chatInput" type="text" placeholder="Type a message..." maxlength="500" autocomplete="off">
        </div>

        <!-- Username modal -->
        <div id="nameModal">
            <div class="dialog">
                <h2>Welcome to SimpleMOBA</h2>
                <p>Enter a username to join the game</p>
                <input id="nameInput" type="text" placeholder="Username" maxlength="20" autocomplete="off" autofocus>
                <button id="nameSubmit">Join Game</button>
                <div class="error" id="nameError"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            var c = document.getElementById("myCanvas");
            var ctx = c.getContext("2d");
            var socket = io();
            var loadingDiv = document.getElementById("loading");
            var container = document.getElementById("gameContainer");

            // --- Detect touch device ---
            var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (isTouch) {
                document.getElementById("mobileHint").style.display = "block";
            }

            // --- Responsive canvas sizing ---
            function resizeCanvas() {
                var w = container.clientWidth;
                var h = container.clientHeight;
                var dpr = window.devicePixelRatio || 1;

                // Set canvas backing store size (crisp on retina)
                c.width = Math.round(w * dpr);
                c.height = Math.round(h * dpr);

                // Scale context so drawing uses CSS pixels
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Tell the game the CSS-pixel viewport size
                if (window.game) {
                    window.game.resizeViewport(w, h);
                }
            }
            window.addEventListener("resize", resizeCanvas);
            window.addEventListener("orientationchange", function() {
                setTimeout(resizeCanvas, 100);
            });
            resizeCanvas();

            // Map to load — can be changed via URL param: ?map=summoners-rift
            var params = new URLSearchParams(window.location.search);
            var mapName = params.get("map") || "summoners-rift";

            // Create game instance (id assigned when server responds)
            window.game = new Game(ctx, socket, -1);

            // After game creation, resize again so renderer knows correct size
            resizeCanvas();

            socket.on('id', (id) => {
                if (window.game && window.game.id === -1) window.game.id = id;
            });

            // --- Username modal ---
            var nameModal = document.getElementById('nameModal');
            var nameInput = document.getElementById('nameInput');
            var nameSubmit = document.getElementById('nameSubmit');
            var nameError = document.getElementById('nameError');
            var myUsername = null;

            function submitUsername() {
                var name = nameInput.value.trim();
                nameError.textContent = '';
                socket.emit('setUsername', name, function(ack) {
                    if (ack && ack.ok) {
                        myUsername = ack.username;
                        nameModal.classList.add('hidden');
                        addChatMessage(null, 'Welcome, ' + ack.username + '!', 'system');
                    } else {
                        nameError.textContent = ack ? ack.error : 'Failed to set username.';
                    }
                });
            }

            nameSubmit.addEventListener('click', submitUsername);
            nameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); submitUsername(); }
            });

            // --- Online users panel ---
            var usersList = document.getElementById('usersList');
            var usersCount = document.getElementById('usersCount');

            socket.on('users', function(list) {
                usersList.innerHTML = '';
                list.forEach(function(u) {
                    var li = document.createElement('li');
                    li.textContent = u.username || ('Player ' + u.id);
                    if (u.id === window.game.id) li.classList.add('me');
                    usersList.appendChild(li);
                });
                var n = list.length;
                usersCount.textContent = n + (n === 1 ? ' player' : ' players');
            });

            // --- Chat ---
            var chatMessages = document.getElementById('chatMessages');
            var chatInput = document.getElementById('chatInput');

            function addChatMessage(msg, text, cls) {
                var div = document.createElement('div');
                if (msg) {
                    // msg = { id, username, text, timestamp }
                    var isMe = msg.id === window.game.id;
                    var span = document.createElement('span');
                    span.className = isMe ? 'chat-self' : 'chat-user';
                    span.textContent = msg.username + ': ';
                    div.appendChild(span);
                    div.appendChild(document.createTextNode(msg.text));
                } else {
                    div.className = cls || 'chat-system';
                    div.textContent = text;
                }
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            socket.on('chat', function(msg) {
                addChatMessage(msg);
            });

            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    var text = chatInput.value.trim();
                    if (text && myUsername) {
                        socket.emit('chat', text);
                        chatInput.value = '';
                    }
                }
            });

            // Load the map from the server, then start the game loop
            fetch(`/maps/${mapName}.json`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    var map = GameMap.fromJSON(data);
                    window.game.loadMap(map);
                    loadingDiv.style.display = 'none';
                })
                .catch(err => {
                    loadingDiv.textContent = `Failed to load map "${mapName}": ${err.message}`;
                    loadingDiv.style.color = 'red';
                    console.error('Map load error:', err);
                });

            // Send local player position to server
            setInterval(() => {
                if (window.game && window.game.id !== -1) {
                    socket.emit('position', {
                        x: window.game.p1.x,
                        y: window.game.p1.y,
                        id: window.game.id
                    });
                }
            }, 70);

            // Receive other players' positions
            socket.on('position', function (otherPlayers) {
                window.game.otherPlayers = otherPlayers;
            });

            // --- Input handlers (mouse + touch) ---
            var ctrl = window.game.controller;

            // Mouse (desktop)
            c.addEventListener("mousedown", ctrl.mouseDown.bind(ctrl));
            c.addEventListener("contextmenu", ctrl.contextMenu.bind(ctrl));
            document.addEventListener("keydown", ctrl.keyDown.bind(ctrl));
            document.addEventListener("keyup", ctrl.keyUp.bind(ctrl));

            // Touch (mobile)
            c.addEventListener("touchstart", ctrl.touchStart.bind(ctrl), { passive: false });
            c.addEventListener("touchmove", ctrl.touchMove.bind(ctrl), { passive: false });
            c.addEventListener("touchend", ctrl.touchEnd.bind(ctrl), { passive: false });
            c.addEventListener("touchcancel", ctrl.touchEnd.bind(ctrl), { passive: false });

            // Prevent default touch behaviors on the whole document
            document.addEventListener("touchstart", function(e) {
                if (e.target === c) e.preventDefault();
            }, { passive: false });
            document.addEventListener("gesturestart", function(e) { e.preventDefault(); });

            // Start the fixed-timestep game loop
            window.game.start();
        });
    </script>

    <!-- Load modules in dependency order -->
    <script src="Map.js"></script>
    <script src="src/Constants.js"></script>
    <script src="src/Geometry.js"></script>
    <script src="src/Camera.js"></script>
    <script src="src/Player.js"></script>
    <script src="src/Renderer.js"></script>
    <script src="src/Controller.js"></script>
    <script src="src/Game.js"></script>
</body>

</html>
